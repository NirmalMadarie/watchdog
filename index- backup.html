 const freeB=b.income-b.costs,freeA=a.income-a.costs;
 const before={free:freeB,left:freeB-b.planned,bufM:b.costs>0?b.buf/b.costs:0,etas:goalEtas(freeB,1,0)};
 const after={free:freeA,left:freeA-b.planned-a.extraPlan,bufM:a.costs>0?a.buf/a.costs:0,etas:goalEtas(freeA,1,a.extraPlan)};
 if(a.extraPlan>0&&(id==='spaar'))after.etas=goalEtas(freeA,1,a.extraPlan);
 let verdict='good',msg;
 if(after.left<0&&freeA<0){verdict='risk';msg=`Je uitgaven liggen dan ${E(-freeA)} per maand boven je inkomen. Je buffer dekt dat ${freeA<0&&a.buf>0?mFmt(a.buf/-freeA):'0'} maanden.`}
 else if(after.left<0){verdict='watch';msg=`Je houdt na je doelen ${E(-after.left)} per maand tekort. Doelen kunnen dan niet allemaal doorlopen.`}
 else if(after.left<before.left-1){verdict='watch';msg=`Je vrij besteedbare bedrag daalt met ${E(before.left-after.left)} per maand.`}
 else if(after.left>before.left+1){msg=`Je vrij besteedbare bedrag stijgt met ${E(after.left-before.left)} per maand.`}
 else msg='Je maandruimte verandert nauwelijks.';
 return {sc:sc,before:before,after:after,verdict:verdict,msg:msg,notes:a.notes,extra:a.extra,par:P};

function dayOfMonthFor(id){return (hash(id)%27)+1}

 const out=[],now=new Date();now.setHours(12,0,0,0);
 const push=(n,amt,id)=>{const dom=dayOfMonthFor(id);let d=new Date(now.getFullYear(),now.getMonth(),dom,12);if(d<now)d=new Date(now.getFullYear(),now.getMonth()+1,dom,12);const inD=Math.round((d-now)/DAY);if(inD<=days)out.push({n:n,amt:amt,inD:inD,id:id,date:d})};
 S.subs.filter(s=>!s.off).forEach(s=>push(s.n,N(s.cost),'sub_'+s.id));
 S.contracts.forEach(c=>push(c.n,cCost(c),'ct_'+c.id));
 return out.sort((a,b)=>a.inD-b.inD);
}

 Object.assign(p,P.p);p.kids=P.kids.length;p.adults=P.adults.length;p.name=P.adults[0][0];

 if(!d)return '<p class="note">Voeg eerst een schuld toe.</p>';
 const x=N(S.ui.dx!=null?S.ui.dx:50),dd=Object.assign({},d,{pay:effPay(d)}),s=debtSim(dd,x);

 else if(!isFinite(bm))txt='Kies een bedrag om te zien wat er gebeurt.';

 const F=fin();
 return `<div class="res">${txt}<br><small>Kosten per maand: ${E(x)} extra. Vrij besteedbaar wordt dan ${E(F.left-x)} per maand.</small></div>`;

const ICOL=['#2563EB','#10B981','#F97316','#7C3AED','#0C3159','#EAB308','#94A3B8'];
function donut(parts){
 const tot=sum(parts.map(p=>p.v))||1,r=15.9;let off=0;
 return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Verdeling van beleggingen"><circle cx="21" cy="21" r="${r}" fill="none" stroke="#E5ECF4" stroke-width="6"/>${parts.map((p,i)=>{const l=p.v/tot*100,s=`<circle cx="21" cy="21" r="${r}" fill="none" stroke="${ICOL[i%ICOL.length]}" stroke-width="6" stroke-dasharray="${l.toFixed(2)} ${(100-l).toFixed(2)}" stroke-dashoffset="${(25-off).toFixed(2)}"/>`;off+=l;return s}).join('')}</svg>`;
}
function lineChart(series,w,h){
 const all=[].concat.apply([],series.map(s=>s.pts)),hi=Math.max(1,Math.max.apply(null,all)*1.05),n=series[0].pts.length,X=i=>8+i*(w-46)/(n-1),Y=v=>h-8-(v/hi)*(h-16);
 return `<svg class="lc" viewBox="0 0 ${w} ${h}" role="img" aria-label="Verwachte ontwikkeling bij verschillende rendementen (illustratief)"><line x1="8" x2="${w-38}" y1="${h-8}" y2="${h-8}" stroke="#CBD5E1"/>${series.map(s=>`<polyline points="${s.pts.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.2" ${s.dash?'stroke-dasharray="4 3"':''} stroke-linecap="round"/><text x="${w-36}" y="${(Y(s.pts[n-1])+3).toFixed(1)}" font-size="9" fill="${s.c}" font-weight="700">${s.l}</text>`).join('')}</svg>`;
}

function aiAnswer(q){
 const s=q.toLowerCase(),A=agg(),F=fin(),B=budTotals(),p=S.profile;
 if(/inkomen.*(daalt|lager|minder|weg)|(daalt|lager).*inkomen|werkloos|baan kwijt|verlies.*(werk|inkomen)/.test(s)){
  const R=scenarioRun('inc20',20),R2=S.hh.adults.length>1?scenarioRun('adult',null,S.hh.adults[S.hh.adults.length-1].id):null;
  const fa=R.after.free,run=fa<0?F.T.income>0?N(p.buffer)/-fa:0:null;
  return S4(`Bij <b>20% minder inkomen</b> daalt je vrije ruimte van ${E(R.before.free)} naar <b>${E(fa)}</b> per maand.${R2?` Als ${esc(S.hh.adults[S.hh.adults.length-1].name)} zijn of haar inkomen verliest: ${E(R2.after.free)} per maand.`:''}`,
   fa<0?`Je uitgaven zouden dan boven je inkomen liggen. Je buffer (${E(p.buffer)}) dekt dat ongeveer <b>${mFmt(run)} maanden</b>.`:`Je blijft positief, maar je doelen en beleggingen krijgen minder ruimte (${E(R.after.left)} vrij besteedbaar).`,
   ul(['Zet doelstortingen en beleggen tijdelijk op pauze.','Loop je bespaarkansen langs (Besparen).','Controleer toeslagen die bij een lager inkomen kunnen ontstaan.']),
   `Met je bespaarkansen (${E(A.pendSave)} per maand) kun je een deel van het gat dichten.`,[['Reken door in Scenario’s','plan/scenario'],['Besparen','besparen']]);
 }
 if(/buffer|noodfonds|reserve|sneller sparen/.test(s)){
  const g=S.goals.find(x=>x.kind==='buffer'),left=g?Math.max(0,N(g.target)-goalSaved(g)):0,mo=g&&N(g.monthly)>0?Math.ceil(left/N(g.monthly)):null;
  const extra=Math.max(50,Math.round(Math.max(0,F.left)*.5/25)*25),mo2=g?Math.ceil(left/(N(g.monthly)+extra)):null;
  return S4(`Je buffer is <b>${E(p.buffer)}</b>: goed voor <b>${mFmt(F.bufMonths)} maanden</b> aan lasten. ${g?`Het doel is ${E(g.target)}.`:'Je hebt nog geen buffer-doel.'}`,
   'Een buffer voorkomt dat een tegenvaller in schulden eindigt. De richtlijn is minstens 3 maanden aan lasten.',
   ul([`Leg <b>${E(extra)}</b> per maand extra opzij${F.left>=extra?' (past in je vrij besteedbare bedrag)':' (meer dan je nu overhoudt: begin kleiner)'}.`,`Zet gerealiseerde besparingen (${E(A.doneSave)} per maand) direct in je buffer.`,'Overweeg de bespaarkansen bij Besparen.']),
   left<=0?'Je buffer is op doel.':`${mo?`Nu: klaar over ${fmtMonths(mo)}. `:''}Met ${E(extra)} extra: over <b>${fmtMonths(mo2)}</b>.`,[['Naar doelen','plan/doelen']]);
 }
 if(/abonnement/.test(s)&&/(meest|duur|kost|groot)/.test(s)||/welke abonnementen/.test(s)){
  const L=S.subs.filter(x=>!x.off).sort((a,b)=>N(b.cost)-N(a.cost)),un=L.filter(x=>x.use==='nooit');
  return S4(`Je abonnementen kosten <b>${E2(subCost())}</b> per maand (<b>${E(subCost()*12)}</b> per jaar). De duurste: ${ul(L.slice(0,4).map(x=>`${esc(x.n)}: ${E2(x.cost)} per maand (${E(N(x.cost)*12)} per jaar), gebruik ${x.use}`))}`,
   un.length?`${un.length} ${plural(un.length,'abonnement wordt','abonnementen worden')} nooit gebruikt: ${E(sum(un.map(x=>N(x.cost)))*12)} per jaar dat je niet gebruikt.`:'Je gebruikt je abonnementen; er is geen duidelijk overbodig abonnement.',
   un.length?`Je kunt ${un.map(x=>esc(x.n)).join(', ')} opzeggen via Besparen (demo). Jij beslist.`:'Controleer om de paar maanden of je alles nog gebruikt.',
   un.length?`Vrij besteedbaar stijgt met ${E(sum(un.map(x=>N(x.cost))))} per maand.`:'Geen direct effect.',[['Naar abonnementen','besparen']]);
 }
 if(/waarom.*(meer|veel|uit)|meer uit|uitgeven|overschrijd|budget.*(over|te hoog)/.test(s)&&!/aankoop|kopen|tv/.test(s)){
  const over=B.over.concat(B.watch).sort((a,b)=>a.diff-b.diff).slice(0,4),extra=sum(over.filter(r=>r.diff<0).map(r=>-r.diff));
  return S4(`Je verwacht deze maand <b>${E(B.proj)}</b> uit te geven tegen een budget van ${E(B.b)} (vorige maand ${E(B.prev)}). ${over.length?`De grootste afwijkingen: ${ul(over.map(r=>`${r.n}: prognose ${E(r.proj)} tegen budget ${E(r.b)} (${r.diff<0?E(-r.diff)+' te veel':E(r.diff)+' ruimte'})`))}`:'Alle categorieën liggen op koers.'}`,
   over.length?`Variabele categorieën als horeca en kleding lopen snel op zonder dat je het merkt. Samen zit hier ${E(extra)} per maand in.`:'Je uitgaven zijn stabiel.',
   over.length?ul([`Stel een weekbedrag in voor ${esc(over[0].n.toLowerCase())}.`,'Voeg uitgaven direct toe zodat de prognose klopt.','Verhoog het budget alleen als het echt structureel is.']):'Ga zo door.',
   over.length?`Terug naar budget: <b>${E(extra)}</b> per maand extra vrij.`:'',[['Bekijk budget','plan/budget']]);
 }
 if(/\btv\b|oled|aankoop|kopen|koop |betalen|laptop|iphone/.test(s)&&!/vakantie|reis|besparen|bespaar/.test(s)){
  const tvDeal=S.deals.find(d=>/tv|oled/i.test(d.t))||S.deals[0],explicit=amountFrom(q),isTv=/tv|oled/.test(s)&&tvDeal,amount=explicit||(isTv?tvDeal.cur:N(p.plannedAmt)||500),label=explicit?'Een aankoop van':isTv?esc(tvDeal.t)+' voor':'Jouw geplande aankoop van';
  const left=F.left,buf2=F.T.costs>0?(N(p.buffer)-amount)/F.T.costs:0,mo=left>0?Math.ceil(amount/left):null;
  const verdict=amount<=left?'<b>Ja.</b> Het past in je vrij besteedbare bedrag.':amount<=F.free?'<b>Ja, met een kanttekening.</b> Het past alleen als je een deel van je doelen pauzeert.':mo&&mo<=6?`<b>Nog niet direct.</b> Sparen kost ${mo} ${plural(mo,'maand','maanden')}.`:'<b>Niet zonder je buffer aan te spreken.</b>';
  return S4(`${label} <b>${E(amount)}</b>: ${verdict}`,
   `Je houdt ${E(left)} vrij besteedbaar per maand over. Uit je buffer betalen laat ${mFmt(Math.max(0,buf2))} maanden dekking over${buf2>=3?' (blijft gezond)':' (onder de 3 maanden)'}.`,
   ul([mo?`Spaar ${E(Math.min(amount,left))} per maand: klaar in ${mo} ${plural(mo,'maand','maanden')}.`:'Maak eerst ruimte via Besparen.',isTv?`Deal Watch: nu ${E(tvDeal.cur)}, jouw limiet ${E(tvDeal.max)} (demo-prijs).`:'Zet het als doel in Plan en laat Deal Watch de prijs bewaken.','Leen niet voor een aankoop die kan wachten.']),
   `Na aankoop uit vrije ruimte: buffer blijft ${mFmt(F.bufMonths)} maanden.`,[['Kies slim','kies'],['Doel maken','plan/doelen'],['Bewaakte keuzes','deals']]);
 }
 if(/besparen|bespaar|goedkoper|kosten verlagen|minder betalen|lek|weglekken/.test(s)){
  const L=A.actions.filter(f=>!f.get&&fMonthly(f)>0).slice(0,3),tot=sum(A.actions.filter(f=>!f.get&&fMonthly(f)>0).map(f=>fMonthly(f)));
  return S4(L.length?`Je kunt ongeveer <b>${E(A.pendSave)} per maand</b> (${E(A.pendSave*12)} per jaar) besparen. De drie grootste kansen: ${ul(L.map(f=>`${Em(fMonthly(f))} per maand: ${esc(f.title)}`))}`:'Je hebt al je bekende bespaarkansen opgepakt.',
   L.length?`Dat is ${Math.round(A.pendSave/Math.max(1,F.fixed)*100)}% van je vaste lasten. Zonder dat je minder hoeft te doen of te missen.`:'Nieuwe kansen verschijnen zodra WATCHDOG iets vindt.',
   L.length?`Op basis van je cijfers lijkt “${esc(L[0].title)}” het meeste op te leveren.`:'Blijf de wacht houden.',
   L.length?`Vrij besteedbaar stijgt van ${E(F.left)} naar ${E(F.left+A.pendSave)} per maand. Spaarpercentage +${Math.round(A.pendSave/Math.max(1,F.income)*100)} procentpunt als je het spaart.`:'',[['Besparen','besparen'],['Alle acties','all-actions']]);
 }
 const old=aiLegacy(q);
 return S4(old.h,'','','',old.acts||[]);

/* ---------- financiële gezondheidscheck: WATCHDOG informeert, de gebruiker beslist ---------- */
function sbSpec(cat,a){
 const b=N(a.budget);
 switch(cat){
  case 'vakantie':return {oneOff:b,monthly:0,label:'vakantie',price:b};
  case 'auto':{if(a.mode==='mijn')return null;const cash=a.pay==='spaargeld'?b:a.pay==='mix'?b*.3:0,loan=b-cash,pay=loan>0?pmt({price:loan,down:0,rate:6,term:60}):0,run=carRun(a)*(S.car&&S.car.has?.4:1);return {oneOff:cash,monthly:pay+run,label:'auto',price:b,pay:pay,run:run,cash:cash}}
  case 'wonen':return a.vorm==='koop'?{oneOff:b*.04,monthly:mortgagePmt(b),label:'woning',price:b}:{oneOff:b*2,monthly:b,label:'huurwoning',price:b};
  case 'telefoon':return {oneOff:b,monthly:0,label:'telefoon',price:b};
  case 'aankoop':case 'elektronica':return {oneOff:b,monthly:0,label:'aankoop',price:b};
  case 'grote':return {oneOff:b,monthly:0,label:'aankoop',price:b};
  case 'opleiding':return {oneOff:b,monthly:0,label:'opleiding',price:b};
  case 'sparen':case 'doel':{const m=(N(a.bedrag)-N(a.gespaard))/Math.max(1,N(a.maanden));return {oneOff:0,monthly:m,label:'doel',price:N(a.bedrag),save:1}}
  case 'beleggen':return {oneOff:0,monthly:N(a.maand),label:'beleggen',price:0,save:1};
  case 'gezin':return {oneOff:0,monthly:a.wat==='kind'?450:N(a.kids)*N(a.dagen)*10*8.4*4.33*.55,label:'gezin',price:0};
 }
 return null;
}
const mortgagePmt=P=>{const r=.041/12,n=360;return P*r/(1-Math.pow(1+r,-n))};
function carRun(a){
 const km=N(a.km)||15000;let cost=0;
 // gemiddelde jaarlijkse gebruikskosten zonder afschrijving: brandstof + verzekering + belasting + onderhoud (indicatief)
 cost=km*.075+700+560+520;return cost/12;
}
function carMin(a){
 const want={compact:['compact'],midden:['midden'],ruim:['ruim']}[a.size],people=N(a.people)||5;let m=1e9;
 CARS.forEach(c=>{if(want&&want.indexOf(c[1])<0)return;if(a.fuel&&a.fuel!=='geen'&&c[2]!==a.fuel)return;if(c[9]<people)return;
  if(a.cond!=='gebruikt')m=Math.min(m,c[3]);if(a.cond!=='nieuw')m=Math.min(m,c[4])});return m>=1e9?0:m;
}
function sbAssess(cat,a){
 const spec=sbSpec(cat,a);if(!spec)return {level:'ok',facts:[],msg:''};
 if(a.fin==='nee')return {level:'ok',off:1,facts:[],msg:'Financiële check overgeslagen op jouw verzoek.'};
 if(S.settings.finctx===false)return {level:'ok',off:1,facts:[],msg:'De financiële check staat uit (zie Profiel). WATCHDOG kijkt dan alleen naar prijs en voorkeuren.'};
 const F=fin(),T=F.T,buf=N(S.profile.buffer),costs=Math.max(1,T.costs),after=buf-spec.oneOff,afterM=after/costs,free=Math.max(0,F.free),left=F.left,ml=spec.monthly;
 const sig=spec.save||spec.oneOff>=Math.max(300,buf*.25)||(ml>0&&ml>=Math.max(40,free*.25));
 let level='ok';
 if(spec.save){level=ml>free?'risk':ml>Math.max(0,left)?'watch':'ok';if(cat==='beleggen'&&F.bufMonths<3&&level==='ok')level='watch'}
 else if(cat==='wonen'){const q=ml/Math.max(1,F.income);level=after<0||q>.5?'risk':q>.4?'watch':'ok'}
 else if(sig){
  if(after<0||(ml>free&&ml>0))level='risk';
  else if(afterM<2||(ml>free*.6&&ml>0)||spec.oneOff>buf*.6)level='watch';
 }
 let alt=null;
 if(level!=='ok'&&N(a.budget)>0&&!spec.save){
  const spare=Math.max(0,buf-costs*3),cap=free*.6;
  let P=spare+(cat==='auto'?Math.max(0,cap-spec.run*.5||0)*48:cat==='wonen'?0:cap*6);
  P=Math.min(N(a.budget)*.9,Math.max(N(a.budget)*(cat==='auto'?.3:.5),P));
  alt=Math.max(500,r5(P,cat==='wonen'?5000:cat==='auto'?500:100));
  if(cat==='auto'){const mn=carMin(a);if(mn)alt=Math.max(alt,Math.ceil(mn/500)*500)}
  if(alt>=N(a.budget)*.95)alt=null;
 }
 const facts=[['Buffer nu',`${E(buf)} (${mFmt(T.bufMonths)} maanden)`]];
 if(spec.oneOff>0)facts.push(['Buffer na aankoop',`${E(after)} (${mFmt(Math.max(0,afterM))} maanden)`]);
 facts.push(['Vrij besteedbaar per maand',E(F.left)]);
 if(ml>0)facts.push([spec.save?'Maandelijkse inleg':'Extra maandlast (indicatief)',E(ml)]);
 const lab=({vakantie:'Deze vakantie',auto:'Deze auto',woning:'Deze woning',huurwoning:'Deze huurwoning',telefoon:'Deze telefoon',aankoop:'Deze aankoop',opleiding:'Deze opleiding',doel:'Dit doel',gezin:'Dit gezin'})[spec.label]||('Deze '+spec.label);let msg;

/* ---------- Smart Buy: televisie, laptop e.d. met specificaties, garantie en totale kosten ---------- */
function elSpec(soort,p,rt,kamer){
 const price=p[1],gar=rt>=4.5?5:rt>=4.2?3:2,rows=[];let kwh=0,life=5,inch=0,fit='';
 if(soort==='tv'){inch=+((p[0].match(/(\d\d)"/)||[0,55])[1]);const panel=/OLED/.test(p[0])?'OLED':/QLED/.test(p[0])?'QLED':'LED',hz=price>800?120:price>500?100:60;kwh=inch*3.4;life=8;
  rows.push(['Formaat',inch+' inch'],['Paneel',panel],['Verversing',hz+' Hz'],['HDMI 2.1',hz>=100?'ja':'nee']);
  const ok=kamer==='klein'?inch<=55:kamer==='groot'?inch>=65:(inch>=50&&inch<=65);fit=ok?'Formaat past bij je kijkafstand':'Formaat wijkt af van wat bij je kijkafstand past';}
 else if(soort==='laptop'){kwh=45;rows.push(['Type',/werk/.test(p[0])?'Werk':/Gamer/.test(p[0])?'Gaming':/Studie|Studio/.test(p[0])?'Studie of creatief':'Basis']);}
 else if(soort==='tablet'){kwh=12;rows.push(['Schermgrootte',(p[0].match(/(\d+)"/)||[0,'—'])[1]+' inch']);}
 else{life=4;rows.push(['Type',/ANC/.test(p[0])?'Noise-cancelling':/Sport/.test(p[0])?'Sport':'Standaard']);}
 return {gar:gar,rows:rows,kwh:kwh,life:life,inch:inch,fit:fit};
}
function genElektronica(a){
 const L=EL[a.soort]||EL.tv,budget=N(a.budget),prio=a.prio||[],out=[];
 L.forEach(p=>{
  if(p[1]>budget*1.12)return;const rt=Math.min(4.8,p[2]+(hash(p[0])%3)/20),sp=elSpec(a.soort,p,rt,a.kamer),en=sp.kwh*.30,tco=p[1]+en*sp.life;
  let sc=45+(p[1]<=budget?12:-14)+(rt-4)*30+(sp.gar-2)*2;
  if(prio.indexOf('prijs')>=0)sc+=Math.max(-10,(budget-p[1])/budget*22);
  if(prio.indexOf('kwaliteit')>=0)sc+=(rt-4.2)*35;
  if(prio.indexOf('duur')>=0)sc+=(p[1]>300?6:0)+sp.gar;
  if(prio.indexOf('groot')>=0&&(sp.inch>=65||/16|Max/.test(p[0])))sc+=7;
  if(prio.indexOf('zuinig')>=0)sc+=Math.max(-6,8-en/12);
  if(sp.fit)sc+=/past bij/.test(sp.fit)?8:-6;
  const soortN={tv:'Televisie',laptop:'Laptop',tablet:'Tablet',koptelefoon:'Koptelefoon'}[a.soort];
  const o=mk('elektronica',a,{title:p[0],sub:`${soortN} · demo-product`,price:p[1],score:sc,kv:[['Prijs',E(p[1])],[`Totaal ${sp.life} jr`,E(tco)],over(budget,p[1])],
   pros:[p[1]<=budget?'Binnen budget':`${E(p[1]-budget)} boven budget`,`Beoordeling ${String(Math.round(rt*10)/10).replace('.',',')}/5 (demo)`,`Garantie ${sp.gar} jaar (demo)`,sp.fit||null,en>0?`Verbruik: circa ${E(en)} per jaar aan stroom`:null].filter(Boolean),
   notes:['Prijzen, specificaties en garantie zijn demo-gegevens. Controleer prijs, retour- en garantievoorwaarden bij de winkel (er is geen live bron).'],
   rows:[['Prijs',E(p[1])]].concat(sp.rows,[['Garantie',sp.gar+' jaar (demo)'],['Stroomkosten per jaar (indicatief)',E(en)],[`Totale kosten over ${sp.life} jaar`,E(tco)]]),watch:{label:'Bewaak deze aankoop',price:p[1],unit:'prijs'}});
  o.why.crit=[['Binnen budget','hoog'],['Beoordeling',prio.indexOf('kwaliteit')>=0?'hoog':'middel'],['Totale kosten incl. stroom','middel'],['Jouw wensen: '+(prio.join(', ')||'geen opgegeven'),'middel']];
  o.why.calc=[`Totale kosten: ${E(p[1])} + ${E(en)} stroom × ${sp.life} jaar = ${E(tco)}`];o.why.ass.push('Stroomprijs €0,30 per kWh. Levensduur is een gemiddelde schatting per soort product.');out.push(o);
 });
 return out.sort(ORD).slice(0,6);
}

function impRecurring(tx,rules){

  const okA=ab.filter(v=>Math.abs(v-med)<=Math.max(1,med*.15)).length;if(okA<Math.max(2,L.length*.7))return;

  const md=days.slice().sort((a,b)=>a-b)[Math.floor(days.length/2)];let f=null;
  if(md>=26&&md<=35&&months.size>=3)f='m';else if(md>=85&&md<=95&&L.length>=3)f='q';else if(md>=350&&md<=380&&L.length>=2)f='j';

  const ck=impCat(last,rules);
  out.push({key:g[k][0].key,dir:last.a<0?'uit':'in',payee:clean(last.p||last.t,40)||'Onbekend',amount:amt,prev:prev,change:prev>0?(amt-prev)/prev:0,freq:f,n:L.length,last:last.d,monthly:f==='m'?amt:f==='q'?amt/3:amt/12,cat:ck.c,conf:ck.conf,decision:(rules&&rules[g[k][0].key])?'x':null});
 });

}

 tx.forEach(t=>{const c=impCat(t,rules);t.c=c.c;t.cf=c.conf;if(t.a>0&&t.c==='onbekend'&&recIn.has(t.key)){t.c='inkomen';t.cf=.7}});

Object.assign(WE.T,{product:['Product-Watch','bag'],deadline:['Deadline-Watch','calendar']});
WE.all=function(){
 const out=[],DAYMS=864e5,w=o=>{o.bron=o.bron||'DEMO';o.meldingAan=o.meldingAan!==false;o.status=o.status||'bewaakt';o.verouderd=!!(o.bronDatum&&Date.now()-o.bronDatum>7*DAYMS);if(o.laatsteControle===undefined)o.laatsteControle=null;if(o.bronDatum===undefined)o.bronDatum=null;out.push(o)};
 [['deals',S.deals,'deal','Aankoop'],['trips',S.trips,'travel','Vakantie'],['tickets',S.tickets,'ticket','Tickets']].forEach(g=>g[1].filter(x=>x.active).forEach(x=>{
  const type=x.wt&&WE.T[x.wt]?x.wt:(g[0]==='trips'?'vakantie':g[0]==='tickets'?'prijs':(x.sb&&x.sb.cat==='auto'?'auto':'product'));
  w({id:g[0]+':'+x.id,type:type,categorie:x.cat||g[3],onderwerp:x.t,huidigeWaarde:x.cur,doelwaarde:x.max,status:x.cur<=x.max?'doel bereikt':'bewaakt',laatsteControle:x.chk||(S.w[g[2]]||{}).checked||null,bronDatum:x.chk||null,meldingAan:x.alert!==false,go:'deals'});
 }));
 if(S.w.contract&&S.w.contract.on)S.contracts.forEach(c=>{
  const d=daysTo(c.end);if(d==null)return;const en=c.id==='c_energy',nt=N(c.notice),dl=d-nt;
  w({id:'contract:'+c.id,type:en?'energie':'contract',categorie:en?'Energie':'Contract',onderwerp:c.n,huidigeWaarde:Math.round(cCost(c)),doelwaarde:null,deadline:c.end,dagen:d,status:d<=(nt||30)?'aandacht':'bewaakt',laatsteControle:S.w.contract.checked||null,bronDatum:S.w.contract.checked||null,go:en?'watch/energy':'watch/contract'});
  if(nt>0&&dl>=-30&&dl<=120)w({id:'deadline:'+c.id,type:'deadline',categorie:'Opzegmoment',onderwerp:'Opzeggen: '+c.n,huidigeWaarde:Math.round(cCost(c)),doelwaarde:null,deadline:c.end,dagen:dl,status:dl<0?'opzegtermijn voorbij':dl<=14?'aandacht':'bewaakt',laatsteControle:S.w.contract.checked||null,bronDatum:S.w.contract.checked||null,go:'watch/contract'});
 });
 if(S.car&&S.car.has&&S.w.auto&&S.w.auto.on){const cur=Math.round(carTrue(S.car.o)),lim=N(S.car.limit);w({id:'auto:mine',type:'auto',categorie:'Auto',onderwerp:S.car.o.name,huidigeWaarde:cur,doelwaarde:lim||null,status:lim&&cur>lim?'boven grens':'bewaakt',laatsteControle:S.w.auto.checked||null,bronDatum:null,go:'watch/auto'})}
 if(S.woning&&S.w.home&&S.w.home.on)w({id:'woning:mine',type:'woning',categorie:'Woning',onderwerp:`${S.woning.pc} ${S.woning.nr}${S.woning.toev}`,huidigeWaarde:Math.round(N(S.profile.housing)),doelwaarde:null,status:'bewaakt',laatsteControle:S.w.home.checked||null,bronDatum:S.woning.ts||null,go:'watch/home'});
 return out;
};
WE.val=function(w){
 if(w.type==='deadline')return w.dagen<0?'voorbij':`nog ${w.dagen} dgn`;
 if(w.dagen!=null)return `over ${w.dagen} dgn · ${E(w.huidigeWaarde)} p/m`;
 if(w.doelwaarde!=null)return `${E(w.huidigeWaarde)} · ${w.type==='auto'?'grens':'doel'} ${E(w.doelwaarde)}`;
 return `${E(w.huidigeWaarde)}${w.type==='woning'||w.type==='auto'?' p/m':''}`;
};
WE.row=function(w){
 const t=WE.T[w.type]||WE.T.prijs;
 return `<button class="row" data-a="we-open" data-arg="${w.id}"><span class="ico" style="--c:#B94E08;--bg:#FFF0E4">${I(t[1])}</span><span class="grow"><b>${esc(w.onderwerp)}</b><small>${t[0]} · ${w.status}${w.bronDatum?` · bron van ${evAgo(w.bronDatum)}${w.verouderd?' (verouderd)':''}`:' · demo-bron'}${w.laatsteControle?` · gecontroleerd ${evAgo(w.laatsteControle)}`:''}</small></span><span class="we-v">${WE.val(w)}</span></button>`;
};
const weStore=id=>{const m=String(id).match(/^(deals|trips|tickets):(.+)$/);return m?S[m[1]].find(x=>x.id===m[2]):null};
ACT['we-open']=id=>{
 const w=WE.all().find(x=>x.id===id);if(!w)return;const t=WE.T[w.type]||WE.T.prijs,it=weStore(id),R=(a,b)=>`<div><span>${a}</span><b>${b}</b></div>`;
 sheet(t[0],`<p><b>${esc(w.onderwerp)}</b></p><div class="rows">${R('Type',t[0])}${R('Categorie',esc(w.categorie))}${R('Huidige waarde',WE.val(w))}${R('Doelwaarde of grens',w.doelwaarde!=null?E(w.doelwaarde):'niet ingesteld')}${R('Status',w.status)}${R('Laatste controle',w.laatsteControle?evAgo(w.laatsteControle):'nog niet')}${R('Bron',w.bron==='DEMO'?'DEMO (geen live bron)':esc(w.bron))}${R('Datum van de bron',w.bronDatum?new Date(w.bronDatum).toLocaleDateString('nl-NL')+(w.verouderd?' (verouderd)':''):'geen live bron')}${R('Meldingen',w.meldingAan?'aan':'uit')}</div>
 <div class="sh-act">${it?`<button class="btn ghost" data-a="we-alert" data-arg="${id}">Meldingen ${w.meldingAan?'uitzetten':'aanzetten'}</button><button class="btn ghost" data-a="we-stop" data-arg="${id}">Stop met bewaken</button>`:''}<button class="btn" data-a="we-go" data-arg="${w.go}">Ga naar dit onderdeel</button></div>
 <p class="note">${demoTag('DEMO')} Waarden en controles zijn gesimuleerd tot er een live bron is gekoppeld.</p>`);
};
ACT['we-go']=g=>{closeSheet();go(g)};
ACT['we-alert']=id=>{const it=weStore(id);if(!it)return;it.alert=it.alert===false;save();closeSheet();refresh();toast(it.alert?'Meldingen staan aan':'Meldingen staan uit')};
ACT['we-stop']=id=>{const it=weStore(id);if(!it)return;snapshot();it.active=false;save();closeSheet();refresh();toast('Gestopt met bewaken',true)};
const create0=WE.create.bind(WE);
WE.create=function(s){
 const r=create0(s);
 if(r&&/^(deals|trips|tickets):/.test(r.id)){const it=weStore(r.id);if(it){it.wt=s.type;save()}return WE.all().find(x=>x.id===r.id)||r}
 return r;
};

/* ---------- WATCHDOG vandaag: geordend, dedupliceerd, met "Later" ---------- */
function vandaagItems(){
 const A=agg(),B=budTotals(),L=[],tr=[].concat(S.deals,S.trips,S.tickets).filter(x=>x.active),sn=S.ui.snooze||{},add=o=>{if(!(sn[o.k]>Date.now()))L.push(o)};
 WE.all().filter(x=>x.type==='deadline'&&x.dagen>=0&&x.dagen<=14).forEach(x=>add({k:'dl:'+x.id,pr:1,ic:'calendar',t:'Opzegmoment nadert',s:`${x.onderwerp.replace('Opzeggen: ','')}: nog ${x.dagen} dagen om op te zeggen.`,b:'Bekijk contract',a:'go',arg:'watch/contract'}));
 const hit=tr.find(x=>x.cur<=x.max);
 if(hit)add({k:'hit:'+hit.id,pr:2,ic:'tag',t:'Een Watch heeft je doel bereikt',s:`${hit.t}: nu ${E(hit.cur)}, jouw grens ${E(hit.max)} (demo-prijs).`,b:'Bekijk',a:'go',arg:'deals'});
 if(S.car&&S.car.has&&N(S.car.limit)>0){const m=carTrue(S.car.o);if(m>N(S.car.limit))add({k:'auto',pr:3,ic:'car',t:'Auto',s:`Je totale autokosten zijn ${E(m)} per maand, boven je grens van ${E(S.car.limit)}.`,b:'Vergelijk mijn auto',a:'sb-go',arg:'auto'})}
 if(S.imp){
  S.imp.recurring.filter(x=>x.dir==='uit'&&x.change>=.05&&x.amount-x.prev>=1&&x.decision!=='negeren').slice(0,1).forEach(x=>add({k:'impup:'+x.key,pr:4,ic:'trend',t:`${x.payee} is duurder geworden`,s:`Van ${E2(x.prev)} naar ${E2(x.amount)} volgens je bestand.`,b:'Bekijk',a:'go',arg:'import'}));
  const u=S.imp.recurring.filter(x=>x.needs&&!x.decision&&x.dir==='uit');
  if(u.length)add({k:'imprev',pr:5,ic:'alert',t:'Terugkerende betalingen wachten op jouw check',s:`${u.length} ${plural(u.length,'betaling','betalingen')}, samen ${E2(sum(u.map(x=>x.monthly)))} per maand.`,b:'Nu controleren',a:'imp-review',arg:''});
 }
 const dr=priceDrops();if(dr>0&&!hit)add({k:'drop',pr:6,ic:'tag',t:'Prijsdaling gevonden',s:`${E(dr)} lager bij je bewaakte keuzes (demo-prijzen).`,b:'Vergelijk opnieuw',a:'go',arg:'deals'});
 const ce=S.contracts.find(c=>c.id==='c_energy'),de=ce?daysTo(ce.end):null;
 if(de!=null&&de>=0&&de<=60){const has=!!findingById('energy_switch');add({k:'energy',pr:7,ic:'bolt',t:'Energiecontract',s:`Over ${de} dagen loopt je contract af.`,b:'Bekijk opties',a:has?'fnd':'go',arg:has?'energy_switch':'watch/energy'})}
 const c2=S.contracts.find(c=>c.id!=='c_energy'&&daysTo(c.end)!=null&&daysTo(c.end)>=0&&daysTo(c.end)<=45);
 if(c2)add({k:'ct:'+c2.id,pr:8,ic:'calendar',t:c2.n,s:`Over ${daysTo(c2.end)} dagen loopt dit contract af.`,b:'Bekijk contract',a:'go',arg:'watch/contract'});
 const ov=B.over[0];if(ov)add({k:'bud:'+ov.n,pr:9,ic:'alert',t:`${ov.n} boven budget`,s:`Prognose ${E(ov.proj)} tegen een budget van ${E(ov.b)}.`,b:'Bekijk budget',a:'go',arg:'plan/budget'});
 const big=A.actions.filter(f=>!f.get&&f.id!=='energy_switch'&&fMonthly(f)>0).sort((x,y)=>fMonthly(y)-fMonthly(x))[0];
 if(big)add({k:'fnd:'+big.id,pr:10,ic:'coins',t:'Mogelijke besparing',s:`${big.title}: geschat ${Em(fMonthly(big))} per maand (nog niet gerealiseerd).`,b:'Bekijk',a:'fnd',arg:big.id});
 return L.sort((a,b)=>a.pr-b.pr);
}
function vandaagCard(){
 const L=vandaagItems(),n=L.length;
 return `<div class="card wd-t">${dogSay(n?`Ik heb <b>${n}</b> ${plural(n,'ding','dingen')} voor je gevonden.`:'Alles rustig. Ik blijf de wacht houden.')}${L.slice(0,3).map(x=>`<div class="vd-w"><button class="vd" data-a="${x.a}" data-arg="${esc(x.arg)}"><span class="vd-i">${I(x.ic)}</span><span class="grow"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="vd-b">${esc(x.b)} ›</span></button><button class="vd-x" data-a="vd-later" data-arg="${esc(x.k)}" aria-label="Later herinneren: ${esc(x.t)}">Later</button></div>`).join('')}${n>3?`<button class="link" data-a="go" data-arg="notifications">Nog ${n-3} bekijken ›</button>`:''}</div>`;
}
ACT['vd-later']=k=>{S.ui.snooze=S.ui.snooze||{};S.ui.snooze[k]=Date.now()+7*864e5;save();refresh();toast('Ik herinner je hier over een week aan.',true)};
init();

</script>
